<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>More Cars</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f9f9f9;
      color: #333;
      transition: background-color 0.3s, color 0.3s;
    }

    body.dark-mode {
      background-color: #121212;
      color: #f0f0f0;
    }

    header {
      background-color: #333;
      color: white;
      padding: 20px 0;
      text-align: center;
    }

    nav {
      text-align: center;
      margin: 20px 0;
    }

    nav a {
      margin: 0 10px;
      padding: 10px 20px;
      text-decoration: none;
      background-color: #007bff;
      color: white;
      border-radius: 5px;
    }

    nav a:hover {
      background-color: #0056b3;
    }

    .toggle-btn {
      margin-top: 10px;
      padding: 8px 16px;
      background-color: #444;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .toggle-btn:hover {
      background-color: #222;
    }

    section {
      padding: 40px 20px;
      text-align: center;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }

    .gallery img {
      width: 100%;
      max-width: 300px;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transition: transform 0.3s;
    }

    .gallery img:hover {
      transform: scale(1.05);
    }

    footer {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 15px 0;
      margin-top: 30px;
    }

    @media (max-width: 600px) {
      nav a {
        display: block;
        margin: 10px auto;
        width: 80%;
      }

      .gallery {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>🚗 More Cars</h1>
    <p>Explore more beautiful rides!</p>
    <button class="toggle-btn" onclick="toggleDarkMode()">🌙 Toggle Dark Mode</button>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="cars.html">More Cars</a>
  </nav>

  <section>
    <h2>More Awesome Cars</h2>
    <div class="gallery">
      <img src="https://images.pexels.com/photos/170811/pexels-photo-170811.jpeg" alt="Yellow Supercar">
      <img src="https://images.pexels.com/photos/210019/pexels-photo-210019.jpeg" alt="Red Alfa Romeo">
      <img src="https://images.pexels.com/photos/358070/pexels-photo-358070.jpeg" alt="Black Sports Car">
    </div>
  </section>

  <footer>
    <p>&copy; 2025 My Portfolio | More Cars Page</p>
  </footer>

  <script>
    function toggleDarkMode() {
      document.body.classList.toggle("dark-mode");
    }
  </script>

</body>
</html>
